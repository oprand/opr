# Recursive Unbound for opr fdns resolve (not a forwarder to 1.1.1.1).
# Paths/username match mvance/unbound:1.22.0. Inbound control is the host bind
# (127.0.0.1:UNBOUND_HOST_PORT, Darwin default 5353); Docker Desktop NATs
# published ports so queries often arrive as 172.16.0.0/12. Listen on 0.0.0.0
# inside the container and ACL loopback + RFC1918. Do not publish 0.0.0.0:53
# on the host.
#
# DNSSEC validation is on (same as Cloudflare/Google/Quad9). Broken chains
# become SERVFAIL; fdns retries those names and does not stamp resolved_at.
# Turning DNSSEC off (drop auto-trust-anchor-file, module-config: "iterator")
# increases throughput but changes answer semantics (bogus data would be stored).

server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no

    username: "_unbound"
    directory: "/opt/unbound/etc/unbound"
    chroot: "/opt/unbound/etc/unbound"
    do-daemonize: no
    logfile: ""
    use-syslog: no
    verbosity: 1

    hide-identity: yes
    hide-version: yes
    identity: "DNS"

    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    auto-trust-anchor-file: "var/root.key"
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    num-threads: 2
    so-reuseport: yes
    # Caches sized for compose mem_limit: 2g (not raised: laptop overlay).
    # Unbound wants rrset ≈ 2× msg. 512m + 256m = 768m leaves ~1.2g for
    # 2×8192 outgoing sockets, key/infra caches, and RSS. The previous
    # 1g+512m left too little and OOMed into an unless-stopped restart loop.
    msg-cache-size: 256m
    msg-cache-slabs: 2
    rrset-cache-size: 512m
    rrset-cache-slabs: 2
    key-cache-slabs: 2
    infra-cache-slabs: 2
    outgoing-range: 8192
    num-queries-per-thread: 4096
    incoming-num-tcp: 50
    edns-buffer-size: 1232
    so-sndbuf: 0

    prefetch: yes
    prefetch-key: yes
    minimal-responses: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    cache-min-ttl: 0
    cache-max-ttl: 86400

    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    use-caps-for-id: no
    val-clean-additional: yes
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    do-not-query-localhost: yes

    # Healthcheck-only name. static local-zone is answered from this conf
    # without recursion or public DNS, so drill can prove the overlay loaded.
    # .test is RFC 2606 reserved; 192.0.2.1 is documentation TEST-NET-1.
    local-zone: "health.opr.test." static
    local-data: "health.opr.test. 3600 IN A 192.0.2.1"

    # ratelimit: per-nameserver (per destination zone) qps for recursion
    # queries sent upstream. 0 = off. Cached answers are not limited.
    # Excess is SERVFAIL. 1000 is the mvance example / commonly documented
    # value. It is not a global cap: 500 unique-name QPS fans out to many
    # auth servers (each well under 1000). A hot TLD (.com NS/DS) is the
    # tightest path (~1-2 upstream qps per client query after NS cache);
    # 1000 leaves headroom so a catalog scan is not collapsed. Default
    # ratelimit-factor (10) still lets 1/10 through if a zone spikes.
    ratelimit: 1000

    # ip-ratelimit: per-client-IP qps, applied BEFORE cache; excess is
    # dropped with no reply (timeouts, not SERVFAIL). 0 = off (Unbound
    # default). Do not enable at a low value: Docker Desktop NAT presents
    # the host scanner as one RFC1918 IP, so 500 QPS from 127.0.0.1 would
    # self-throttle. Inbound is already loopback-only on the host.
    ip-ratelimit: 0

remote-control:
    control-enable: no
