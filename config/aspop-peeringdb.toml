# AS population and PeeringDB.
#
# opr run --config examples/aspop-peeringdb.toml
#
# Secrets stay in the environment. Postgres only:
#   OPR_POSTGRES_DB       Postgres connection string (required for `opr run`)
#   OPR_PEERINGDB_APIKEY  PeeringDB API key (optional; the public API works without it)
#
# Omitted keys keep the one-shot defaults. Omitted `enabled` means true, so
# every other job is listed with enabled = false. Otherwise `opr run` would
# start the whois dumps and fdns.ingest-cc.

[aspop]
enabled = true
interval = "6h"

[peeringdb]
enabled = true
interval = "24h"
force = false               # API key is OPR_PEERINGDB_APIKEY; the public API works without it

# Every other job stays off.

[registry-crawl.worker]
enabled = false
ipnet = false               # ipnet alone starts the RDAP queue

[registry-crawl.seed]
enabled = false

[registry-crawl.bulk]
enabled = false

[geonames]
enabled = false

[geoip.lacnic]
enabled = false

[geoip.ipmap]
enabled = false

[geoip.anycast]
enabled = false

[geoip.crawl-geofeeds]
enabled = false

[rpki.ingest]
enabled = false

[fdns.ingest-lists]
enabled = false

[fdns.resolve]
enabled = false

[fdns.ingest-cc]
enabled = false

[fdns.seed-queue]
enabled = false

[rdns.ingest]
enabled = false

[rdns.crawl-ptr]
enabled = false
